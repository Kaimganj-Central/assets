
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700&family=Noto+Sans+Tamil:wght@700&family=Noto+Sans+Bengali:wght@700&family=Noto+Sans+Telugu:wght@700&family=Noto+Sans+Malayalam:wght@700&family=Noto+Sans+Kannada:wght@700&family=Noto+Sans+Gujarati:wght@700&family=Noto+Sans+Gurmukhi:wght@700&family=Noto+Sans+Oriya:wght@700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  .scene{
    width:100%;min-height:480px;
    background:linear-gradient(180deg,#0a1628 0%,#1a2f6e 35%,#c8541a 65%,#f4a140 80%,#fde9b8 100%);
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  }
  .stars{position:absolute;inset:0;pointer-events:none}
  .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 2s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
  .sun{
    position:absolute;width:72px;height:72px;
    background:radial-gradient(circle,#fffbe0 0%,#ffe066 40%,#ff9900 100%);
    border-radius:50%;left:50%;bottom:32%;transform:translateX(-50%);
    box-shadow:0 0 60px 24px rgba(255,180,0,.3);
    animation:sunrise 2.5s ease-out forwards;
  }
  @keyframes sunrise{0%{bottom:22%;opacity:.3}100%{bottom:32%;opacity:1}}
  .mtn-back{position:absolute;bottom:20%;left:0;right:0;height:110px}
  .mtn-front{position:absolute;bottom:16%;left:0;right:0;height:80px}
  .ground{position:absolute;bottom:0;left:0;right:0;height:17%;background:linear-gradient(180deg,#2d5a1b,#1a3a0d)}
  .road{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:14%;height:100%;background:#444}
  .rl{position:absolute;width:7px;height:18px;background:#fff;left:50%;transform:translateX(-50%);animation:rmove 1s linear infinite}
  @keyframes rmove{0%{top:0;opacity:1}100%{top:100%;opacity:0}}
  .city-layer{position:absolute;bottom:16%;left:0;right:0;display:flex;justify-content:center;align-items:flex-end;gap:3px;padding:0 8%}
  .bld{background:#111828;position:relative;animation:brise .8s ease-out both;transform-origin:bottom}
  @keyframes brise{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
  .bld::before{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:3px;height:5px;background:#ff4444;border-radius:2px 2px 0 0;animation:blink 1.5s step-end infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .win{position:absolute;width:4px;height:4px;background:rgba(255,220,80,.75);animation:wblink 3s ease-in-out infinite}
  @keyframes wblink{0%,100%{opacity:.25}50%{opacity:1}}
  .cloud{position:absolute;background:rgba(255,255,255,.15);border-radius:40px;animation:fcloud linear infinite}
  @keyframes fcloud{0%{left:-18%}100%{left:118%}}
  .bird{position:absolute;animation:fbird linear infinite}
  @keyframes fbird{0%{left:-6%;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:108%;opacity:0}}

  .brand-center{
    position:relative;z-index:20;
    display:flex;align-items:baseline;gap:14px;
    justify-content:center;
  }
  .changing-word{
    font-size:clamp(30px,6vw,52px);
    font-weight:700;
    color:#ffe066;
    text-shadow:0 2px 16px rgba(0,0,0,.6);
    min-width:180px;
    text-align:right;
    position:relative;
    overflow:hidden;
    height:1.15em;
    display:flex;align-items:center;justify-content:flex-end;
  }
  .word-inner{
    position:absolute;right:0;
    display:inline-block;
    white-space:nowrap;
  }
  .fixed-word{
    font-size:clamp(30px,6vw,52px);
    font-weight:700;
    color:#ffffff;
    text-shadow:0 2px 10px rgba(0,0,0,.4);
    letter-spacing:2px;
    white-space:nowrap;
  }

  .lang-sub{
    position:relative;z-index:20;
    margin-top:8px;
    font-size:12px;
    color:rgba(255,255,255,.5);
    font-family:var(--font-sans,sans-serif);
    letter-spacing:1px;
    text-transform:uppercase;
    height:16px;
    text-align:center;
  }
  .sub-inner{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
</style>

<div class="scene">
  <div class="stars" id="stars"></div>

  <div class="cloud" style="width:90px;height:24px;top:7%;animation-duration:22s;animation-delay:0s"></div>
  <div class="cloud" style="width:65px;height:18px;top:13%;animation-duration:17s;animation-delay:7s"></div>
  <div class="cloud" style="width:110px;height:26px;top:5%;animation-duration:26s;animation-delay:13s"></div>

  <div class="sun"></div>

  <svg class="mtn-back" viewBox="0 0 1000 110" preserveAspectRatio="none">
    <polygon points="0,110 130,20 260,110" fill="#1e2d66" opacity=".75"/>
    <polygon points="110,110 290,5 470,110" fill="#192660" opacity=".85"/>
    <polygon points="320,110 520,0 720,110" fill="#14204e" opacity=".9"/>
    <polygon points="570,110 750,18 920,110" fill="#1e2d66" opacity=".75"/>
    <polygon points="800,110 950,25 1000,80 1000,110" fill="#14204e" opacity=".85"/>
    <polygon points="510,110 521,0 532,110" fill="#fff" opacity=".12"/>
    <polygon points="280,110 292,5 304,110" fill="#fff" opacity=".1"/>
  </svg>
  <svg class="mtn-front" viewBox="0 0 1000 80" preserveAspectRatio="none">
    <polygon points="0,80 90,15 200,80" fill="#0e1630"/>
    <polygon points="160,80 310,5 460,80" fill="#0a1228"/>
    <polygon points="400,80 580,0 750,80" fill="#080e20"/>
    <polygon points="680,80 840,18 970,80" fill="#0a1228"/>
    <polygon points="890,80 980,28 1000,55 1000,80" fill="#0e1630"/>
  </svg>

  <div class="city-layer" id="cityLayer"></div>
  <div class="ground"><div class="road"><div class="rl" style="top:5%;animation-delay:0s"></div><div class="rl" style="top:38%;animation-delay:.4s"></div><div class="rl" style="top:70%;animation-delay:.8s"></div></div></div>

  <svg class="bird" style="top:10%;width:20px;animation-duration:15s;animation-delay:1s;" viewBox="0 0 20 10"><path d="M0,5 Q5,0 10,5 Q15,0 20,5" fill="none" stroke="#1a2f6e" stroke-width="1.5"/></svg>
  <svg class="bird" style="top:17%;width:14px;animation-duration:20s;animation-delay:9s;" viewBox="0 0 20 10"><path d="M0,5 Q5,0 10,5 Q15,0 20,5" fill="none" stroke="#1a2f6e" stroke-width="1.5"/></svg>

  <div class="brand-center">
    <div class="changing-word" id="changingWord">
      <span class="word-inner" id="wordInner">अपना</span>
    </div>
    <div class="fixed-word">Central</div>
  </div>
  <div class="lang-sub"><span class="sub-inner" id="langSub">Hindi</span></div>
</div>

<script>
const starsEl = document.getElementById('stars');
for(let i=0;i<55;i++){
  const s=document.createElement('div');s.className='star';
  s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
  s.style.animationDelay=Math.random()*3+'s';s.style.animationDuration=(1.5+Math.random()*2)+'s';
  starsEl.appendChild(s);
}

const bldgs=[{w:26,h:68},{w:18,h:46},{w:34,h:88},{w:20,h:58},{w:16,h:42},{w:38,h:108},{w:22,h:62},{w:28,h:78},{w:15,h:38},{w:24,h:70},{w:18,h:52},{w:32,h:92},{w:16,h:44},{w:20,h:60},{w:26,h:72},{w:14,h:36},{w:30,h:84},{w:22,h:50}];
const city=document.getElementById('cityLayer');
bldgs.forEach((b,i)=>{
  const d=document.createElement('div');
  d.className='bld';d.style.width=b.w+'px';d.style.height=b.h+'px';d.style.animationDelay=(i*0.04)+'s';
  const rows=Math.floor(b.h/13),cols=Math.floor(b.w/8);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(Math.random()>.45){
      const w=document.createElement('div');w.className='win';
      w.style.top=(3+r*11)+'px';w.style.left=(3+c*8)+'px';
      w.style.animationDelay=(Math.random()*4)+'s';w.style.animationDuration=(1.5+Math.random()*2.5)+'s';
      d.appendChild(w);
    }
  }
  city.appendChild(d);
});

const words=[
  {text:'अपना',  font:"'Noto Sans Devanagari',sans-serif", lang:'Hindi'},
  {text:'ஆமி',   font:"'Noto Sans Tamil',sans-serif",       lang:'Tamil'},
  {text:'आमचा',  font:"'Noto Sans Devanagari',sans-serif", lang:'Marathi'},
  {text:'మన',    font:"'Noto Sans Telugu',sans-serif",      lang:'Telugu'},
  {text:'আমার',  font:"'Noto Sans Bengali',sans-serif",     lang:'Bengali'},
  {text:'നമ്മൾ',font:"'Noto Sans Malayalam',sans-serif",   lang:'Malayalam'},
  {text:'ನಮ್ಮ', font:"'Noto Sans Kannada',sans-serif",      lang:'Kannada'},
  {text:'આપણું', font:"'Noto Sans Gujarati',sans-serif",    lang:'Gujarati'},
  {text:'ਆਪਣਾ', font:"'Noto Sans Gurmukhi',sans-serif",    lang:'Punjabi'},
  {text:'ଆମ',   font:"'Noto Sans Oriya',sans-serif",       lang:'Odia'},
];

const animations=[
  // slide up
  (el,done)=>{
    el.style.transition='none';el.style.transform='translateY(100%)';el.style.opacity='0';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.style.transition='transform .45s cubic-bezier(.22,.61,.36,1), opacity .35s ease';
      el.style.transform='translateY(0)';el.style.opacity='1';
      setTimeout(done,480);
    }));
  },
  // slide down
  (el,done)=>{
    el.style.transition='none';el.style.transform='translateY(-110%)';el.style.opacity='0';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.style.transition='transform .45s cubic-bezier(.22,.61,.36,1), opacity .35s ease';
      el.style.transform='translateY(0)';el.style.opacity='1';
      setTimeout(done,480);
    }));
  },
  // zoom in
  (el,done)=>{
    el.style.transition='none';el.style.transform='scale(0.3)';el.style.opacity='0';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.style.transition='transform .5s cubic-bezier(.34,1.56,.64,1), opacity .3s ease';
      el.style.transform='scale(1)';el.style.opacity='1';
      setTimeout(done,520);
    }));
  },
  // slide left
  (el,done)=>{
    el.style.transition='none';el.style.transform='translateX(-80px)';el.style.opacity='0';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.style.transition='transform .42s cubic-bezier(.22,.61,.36,1), opacity .32s ease';
      el.style.transform='translateX(0)';el.style.opacity='1';
      setTimeout(done,460);
    }));
  },
  // flip Y
  (el,done)=>{
    el.style.transition='none';el.style.transform='rotateY(90deg)';el.style.opacity='0';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.style.transition='transform .5s ease, opacity .3s ease';
      el.style.transform='rotateY(0deg)';el.style.opacity='1';
      setTimeout(done,520);
    }));
  },
  // bounce down
  (el,done)=>{
    el.style.transition='none';el.style.transform='translateY(-140%) scaleY(0.6)';el.style.opacity='0';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.style.transition='transform .55s cubic-bezier(.36,.07,.19,.97), opacity .3s ease';
      el.style.transform='translateY(0) scaleY(1)';el.style.opacity='1';
      setTimeout(done,580);
    }));
  },
  // spin
  (el,done)=>{
    el.style.transition='none';el.style.transform='rotate(-180deg) scale(0.5)';el.style.opacity='0';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.style.transition='transform .5s cubic-bezier(.34,1.56,.64,1), opacity .3s ease';
      el.style.transform='rotate(0deg) scale(1)';el.style.opacity='1';
      setTimeout(done,540);
    }));
  },
  // slide right
  (el,done)=>{
    el.style.transition='none';el.style.transform='translateX(80px)';el.style.opacity='0';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.style.transition='transform .42s cubic-bezier(.22,.61,.36,1), opacity .32s ease';
      el.style.transform='translateX(0)';el.style.opacity='1';
      setTimeout(done,460);
    }));
  },
  // fade
  (el,done)=>{
    el.style.transition='none';el.style.opacity='0';el.style.transform='scale(1.15)';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.style.transition='opacity .5s ease, transform .5s ease';
      el.style.opacity='1';el.style.transform='scale(1)';
      setTimeout(done,520);
    }));
  },
  // flip X
  (el,done)=>{
    el.style.transition='none';el.style.transform='rotateX(90deg)';el.style.opacity='0';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.style.transition='transform .5s ease, opacity .3s ease';
      el.style.transform='rotateX(0deg)';el.style.opacity='1';
      setTimeout(done,520);
    }));
  },
];

const wordEl=document.getElementById('wordInner');
const subEl=document.getElementById('langSub');
let idx=0;

function exitAnimate(el, cb){
  el.style.transition='transform .3s ease, opacity .25s ease';
  el.style.transform='translateY(-60%)';
  el.style.opacity='0';
  setTimeout(cb,320);
}
function exitSub(el,cb){
  el.style.transition='opacity .2s';el.style.opacity='0';setTimeout(cb,220);
}

function next(){
  idx=(idx+1)%words.length;
  const w=words[idx];
  const anim=animations[idx%animations.length];

  exitAnimate(wordEl,()=>{
    wordEl.style.transition='none';
    wordEl.style.transform='none';
    wordEl.style.opacity='0';
    wordEl.textContent=w.text;
    wordEl.style.fontFamily=w.font;
    anim(wordEl,()=>{});
  });

  exitSub(subEl,()=>{
    subEl.style.transition='none';subEl.style.opacity='0';
    subEl.textContent=w.lang;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      subEl.style.transition='opacity .3s';subEl.style.opacity='1';
    }));
  });
}

setInterval(next,2200);
</script>
